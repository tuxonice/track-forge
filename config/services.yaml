# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.rate_limiter_interval: '%env(RATE_LIMITER_REFILL_PERIOD)% seconds'
    # A subdirectory (relative to the project root) rather than a full path so .env.test can
    # point it at var/data_test instead, keeping functional tests off real uploaded data.
    app.data_path: '%kernel.project_dir%/%env(UPLOAD_DATA_SUBDIR)%'
    # Defaults so an existing deployment's .env (which predates these) still boots; override via env.
    env(ROUTE_CROSSING_TOLERANCE_M): '25'
    env(ROUTE_MAX_SUGGESTIONS): '5'
    env(ROUTE_MAX_TRACKS): '6'
    env(ROUTE_SEARCH_STEP_CAP): '100000'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $emailFrom: '%env(EMAIL_FROM)%'
            int $paginationIpp: '%env(int:PAGINATION_IPP)%'
            string $gpxSchemaPath: '%kernel.project_dir%/src/Schemas/gpx.xsd'
            string $gpxSchema10Path: '%kernel.project_dir%/src/Schemas/gpx-1.0.xsd'
            string $dataPath: '%app.data_path%'
            string $allowCountryCode: '%env(ALLOW_COUNTRY_CODE)%'
            int $loginCodeTtl: '%env(int:LOGIN_TOLERANCE_TIME)%'
            float $routeCrossingToleranceM: '%env(float:ROUTE_CROSSING_TOLERANCE_M)%'
            int $routeMaxSuggestions: '%env(int:ROUTE_MAX_SUGGESTIONS)%'
            int $routeMaxTracks: '%env(int:ROUTE_MAX_TRACKS)%'
            int $routeSearchStepCap: '%env(int:ROUTE_SEARCH_STEP_CAP)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
